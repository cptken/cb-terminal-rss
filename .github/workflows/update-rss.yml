name: Update CB Terminal RSS

on:
  schedule:
    # 毎時0分(UTC)に実行 ※GitHub側の混雑で数分〜数十分遅れることあり
    - cron: '0 * * * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write   # RSSをpushするため
  actions: write    # 自動停止防止(Keepalive)のため

jobs:
  update-rss:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        
    - name: Run scraper
      run: |
        python scrape.py
        
    - name: Commit and push if changed
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add cb_terminal.xml
        if ! git diff --quiet --cached; then
          git commit -m "Update RSS feed"
          git pull --rebase origin main || true
          git push origin main
        fi

    - name: Keepalive (prevent auto-disable)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-rss.yml/enable"
